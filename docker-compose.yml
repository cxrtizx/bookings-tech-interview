services:
    bookings-db:
        image: postgres:18
        environment:
            - POSTGRES_USER=bookings
            - POSTGRES_PASSWORD=bookings
            - POSTGRES_DB=bookings
        ports:
            - "5432:5432"
        volumes:
            - bookings-db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bookings -d bookings"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    bookings-broker:
        image: rabbitmq:4-management
        environment:
            - RABBITMQ_DEFAULT_USER=bookings
            - RABBITMQ_DEFAULT_PASS=bookings
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    bookings-db-data:
